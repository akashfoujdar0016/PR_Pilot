# ─────────────────────────────────────────────────────────────────────────────
# PR Pilot — Caller Workflow Template (for any repository)
# ─────────────────────────────────────────────────────────────────────────────
# Drop this file into ANY repo at: .github/workflows/pr-pilot.yml
#
# Prerequisites (one-time setup in that repository):
#   1. Add GEMINI_API_KEY as a repo secret (Settings → Secrets and variables → Actions)
#
# You do NOT need Python, scripts, or requirements in that repository.
# GitHub Actions will download PR Pilot directly from akashfoujdar0016/PR_Pilot.
# ─────────────────────────────────────────────────────────────────────────────

name: 🤖 PR Pilot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ai-review:
    name: 🔍 AI Code Review
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR Pilot AI Review
        uses: akashfoujdar0016/PR_Pilot@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_type: "review"

  changelog:
    name: 📄 Generate Changelog
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR Pilot Changelog Generator
        uses: akashfoujdar0016/PR_Pilot@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_type: "changelog"

      - name: Commit Changelog Update
        run: |
          git config --local user.name "PR Pilot Bot"
          git config --local user.email "pr-pilot-bot@github-actions.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "📄 chore: update changelog for PR #${{ github.event.pull_request.number }} [skip ci]"
          git push
